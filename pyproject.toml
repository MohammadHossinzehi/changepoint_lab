[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "changepoint_lab"
version = "1.0.0"
description = "Offline and online changepoint detection in NumPy: PELT, optimal partitioning, segment neighbourhood, CROPS, binary segmentation and Bayesian online changepoint detection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.scripts]
changepoint_lab = "changepoint_lab.cli:main"

[tool.setuptools]
packages = ["changepoint_lab"]
